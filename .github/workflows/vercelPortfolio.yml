name: Vercel CICD Portfolio Client

on:
  push:
    branches:
      - main
    paths:
      - 'shaikhsabirportfolio/**'
      - '.github/workflows/vercelPortfolio.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'shaikhsabirportfolio/**'
      - '.github/workflows/vercelPortfolio.yml'

defaults:
  run:
    working-directory: ./shaikhsabirportfolio

jobs:
  # JOB 1: Code Quality & Build Verification
  lint-and-build:
    name: Lint and Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only Portfolio Client folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ./shaikhsabirportfolio
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./shaikhsabirportfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Build
        run: npm run build

  # JOB 2: Preview Deployment (Runs on Pull Requests & posts preview URL comment)
  deploy-preview:
    name: Deploy Preview to Vercel
    needs: lint-and-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout only Portfolio Client folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shaikhsabirportfolio
          sparse-checkout-cone-mode: false

      - name: Deploy Preview to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_USER_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./shaikhsabirportfolio

  # JOB 3: Production Deployment (Runs only on push/merge to main)
  deploy-production:
    name: Deploy Production to Vercel
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only Portfolio Client folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shaikhsabirportfolio
          sparse-checkout-cone-mode: false

      - name: Deploy Production to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_USER_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./shaikhsabirportfolio
          vercel-args: '--prod'
