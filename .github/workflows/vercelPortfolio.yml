name: Vercel CICD Portfolio Client

on:
  push:
    branches:
      - main
    paths:
      - 'shaikhsabirportfolio/client/**'
      - '.github/workflows/vercelPortfolio.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'shaikhsabirportfolio/client/**'
      - '.github/workflows/vercelPortfolio.yml'

defaults:
  run:
    working-directory: ./shaikhsabirportfolio/client

jobs:
  # JOB 1: Build Verification
  build-client:
    name: Verify Client Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portfolio Client folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shaikhsabirportfolio/client

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./shaikhsabirportfolio/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (if configured)
        run: npm run lint --if-present

      - name: Verify Build
        run: npm run build

  # JOB 2: Preview Deployment (Runs on Pull Requests & posts preview URL comment)
  deploy-preview:
    name: Deploy Preview to Vercel
    needs: build-client
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout only Portfolio Client folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shaikhsabirportfolio/client

      - name: Deploy Preview to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_USER_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./shaikhsabirportfolio/client

  # JOB 3: Production Deployment (Runs only on push/merge to main)
  deploy-production:
    name: Deploy Production to Vercel
    needs: build-client
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only Portfolio Client folder
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shaikhsabirportfolio/client

      - name: Deploy Production to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_USER_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./shaikhsabirportfolio/client
          vercel-args: '--prod'
