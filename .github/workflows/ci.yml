name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'DotNet React CRUD/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'DotNet React CRUD/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: ./DotNet React CRUD/Server/CRUD Web API
        run: dotnet restore "CRUD Web API.slnx"

      - name: Build
        working-directory: ./DotNet React CRUD/Server/CRUD Web API
        run: dotnet build "CRUD Web API.slnx" --configuration Release --no-restore

      - name: Test
        working-directory: ./DotNet React CRUD/Server/CRUD Web API
        run: dotnet test "CRUD Web API.slnx" --configuration Release --no-build --no-restore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./DotNet React CRUD/Client/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./DotNet React CRUD/Client/frontend
        run: npm ci

      - name: Lint
        working-directory: ./DotNet React CRUD/Client/frontend
        run: npm run lint

      - name: Build
        working-directory: ./DotNet React CRUD/Client/frontend
        run: npm run build

  docker:
    name: Validate Docker images
    runs-on: ubuntu-latest
    env:
      MSSQL_SA_PASSWORD: CI_Dummy_Only_123!
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: ./DotNet React CRUD
        run: docker compose config --quiet

      - name: Build application images
        working-directory: ./DotNet React CRUD
        run: docker compose build api client
